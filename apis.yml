aid: 3p-learning-pty
name: 3P Learning Pty
description: '3P Learning is an educational technology company that builds blended learning software
  for mathematics and literacy used by schools and families worldwide. Its product family includes
  Mathletics, Mathseeds, Reading Eggs, Writing Legends, LiteracyPlanet and Brightpath, reaching more
  than 20 million students across 130+ countries. The programs pair interactive student activities with
  teacher dashboards, reporting and curriculum-aligned content, and integrate into school systems via
  single sign-on and rostering standards such as Clever and LTI. 3P Learning is backed by Insight Partners
  and profiled in the API Evangelist network. This company publishes consumer and school-facing web and
  mobile products but does not expose a public first-party developer API or documented API surface.'
